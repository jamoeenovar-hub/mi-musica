<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Música">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Mi Música</title>
<style>
:root{--bg:#0b1216;--card:#141f26;--card2:#1b2a33;--line:#22313a;--txt:#e8f0f2;--mut:#8aa0a8;--ac:#2dd4bf;--on:#04201d;--danger:#f0716b}
html[data-ac="green"]{--ac:#1db954}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overscroll-behavior:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100%;height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative;overflow:hidden}
#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 14px) 16px 12px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.top h1,.phead h1{font-size:24px;font-weight:600;margin:0;letter-spacing:-.01em}
.sub{font-size:12px;color:var(--mut);margin:2px 0 6px}
.btn{background:var(--ac);color:var(--on);border:0;border-radius:22px;padding:9px 16px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:var(--card2);color:var(--txt)}
.btn.wide{width:100%;margin:10px 0 6px}
.btn.danger{background:var(--card2);color:var(--danger)}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.f{fill:currentColor}
.icb{background:none;border:0;color:var(--mut);padding:6px;display:flex;align-items:center;justify-content:center}
.icb.on{color:var(--ac)}
.row{display:flex;align-items:center;gap:12px;padding:8px 0;cursor:pointer}
.row.big{padding:12px 0}
.row.miss{opacity:.5;cursor:default}
.cov{width:44px;height:44px;border-radius:8px;background:color-mix(in srgb,var(--ac) 22%,var(--card));color:var(--ac);display:flex;align-items:center;justify-content:center;flex:none}
.cov.big{width:62px;height:62px;border-radius:12px}
.cov.sm{width:38px;height:38px}
.meta{flex:1;min-width:0}
.t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.big .t{font-size:16px}
.row.cur .t{color:var(--ac)}
.row.cur .cov{background:var(--ac);color:var(--on)}
.chev{color:var(--mut);display:flex}
.phead{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.phead .meta h1{white-space:normal}
.acts{display:flex;gap:10px}
.empty{text-align:center;padding:60px 20px;color:var(--mut)}
.empty .ei{color:var(--ac);display:flex;justify-content:center;margin-bottom:10px}
.empty .et{color:var(--txt);font-weight:500;font-size:17px;margin-bottom:4px}
.sec{background:var(--card);border-radius:14px;padding:14px;margin-bottom:14px}
.sec h2{font-size:15px;font-weight:600;margin:0 0 4px}
.sec p{font-size:13px;color:var(--mut);margin:0 0 10px}
.chips{display:flex;gap:10px}
.chip{flex:1;background:var(--card2);border:2px solid transparent;border-radius:12px;padding:12px;display:flex;align-items:center;gap:8px;font-weight:500}
.chip.on{border-color:var(--ac)}
.dot{width:16px;height:16px;border-radius:50%;flex:none}
.pre{white-space:pre-line;font-size:13px;color:var(--mut);margin:0 0 10px}
#mini{display:none;margin:0 8px 6px;background:var(--card2);border-radius:12px;padding:8px 10px;align-items:center;gap:10px;position:relative;cursor:pointer;overflow:hidden}
#mini.on{display:flex}
#mini .icb{color:var(--txt)}
.mbar{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--line)}
.mbar i{display:block;height:2px;width:0;background:var(--ac)}
#nav{display:flex;border-top:1px solid var(--line);padding:6px 0 calc(env(safe-area-inset-bottom) + 4px);background:var(--bg)}
#nav button{flex:1;background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:4px 0}
#nav button.on{color:var(--ac)}
#full{position:absolute;inset:0;background:var(--bg);transform:translateY(102%);transition:transform .3s ease;z-index:20;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 24px calc(env(safe-area-inset-bottom) + 24px)}
#full.open{transform:none}
.bigwrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.bigcov{width:min(76vw,320px);aspect-ratio:1;border-radius:18px;background:color-mix(in srgb,var(--ac) 22%,var(--card));color:var(--ac);display:flex;align-items:center;justify-content:center}
.ft{font-size:21px;font-weight:600;margin-top:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fa{font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:linear-gradient(to right,var(--ac) var(--p,0%),var(--line) var(--p,0%));outline:none;margin:20px 0 8px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--txt)}
.times{display:flex;justify-content:space-between;font-size:11px;color:var(--mut)}
.ctl{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.play{width:64px;height:64px;border-radius:50%;background:var(--ac);color:var(--on);border:0;display:flex;align-items:center;justify-content:center}
#sheet{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none;align-items:flex-end}
#sheet.on{display:flex}
#sheet .box{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:10px 8px calc(env(safe-area-inset-bottom) + 10px);max-height:75%;overflow:auto}
.sh{padding:8px 12px 10px;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it{padding:14px 12px;border-radius:10px;font-size:16px}
.it:active{background:var(--card2)}
.it.danger{color:var(--danger)}
#pick{position:absolute;inset:0;background:var(--bg);z-index:35;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 16px 0}
#pick.on{display:flex}
#pickList{flex:1;overflow-y:auto;padding-bottom:calc(env(safe-area-inset-bottom) + 12px)}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--mut);display:flex;align-items:center;justify-content:center;flex:none;color:var(--on)}
.chk.on{background:var(--ac);border-color:var(--ac)}
#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 130px);transform:translateX(-50%);background:var(--card2);padding:10px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:90%;text-align:center}
#toast.show{opacity:1}
.cov{overflow:hidden}
.cov img{width:100%;height:100%;object-fit:cover;display:block}
.row.cur .cov{box-shadow:0 0 0 2px var(--ac)}
.bigcov{overflow:hidden}
.bigcov img{width:100%;height:100%;object-fit:cover;display:block}
#study{display:none;flex:1;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 14px) 16px 12px}
#study.on{display:flex}
#app.study #mini{display:none!important}
.vwrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.vwrap video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.aonly{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:6px;background:var(--card);color:var(--ac);font-size:14px}
.stctl{display:flex;align-items:center;justify-content:center;gap:34px;margin:18px 0 14px}
.stctl .icb{color:var(--txt)}
.pills{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pill{background:var(--card2);color:var(--txt);border:0;border-radius:20px;padding:9px 16px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.pill.on{background:var(--ac);color:var(--on)}
</style>
</head>
<body>
<div id="app">
  <main id="view"></main>
  <section id="study">
    <div class="top"><h1>Estudio</h1><button class="btn ghost" data-act="stPick">Elegir archivo</button></div>
    <div id="stEmpty" class="empty"><div class="ei" id="stEmptyIc"></div><div class="et">Nada reproduciéndose</div><div>Elige un video o audio de tu iPhone. Se reproduce directo desde Archivos y no se guarda en la app.</div></div>
    <div id="stMain" style="display:none;flex-direction:column">
      <div class="s" id="stName" style="margin-bottom:8px"></div>
      <div class="vwrap" data-act="stToggle"><video id="vd" playsinline preload="metadata"></video><div id="aOnly" class="aonly"><div id="aOnlyIc"></div><div>Solo audio</div></div></div>
      <input type="range" id="stSeek" min="0" max="1000" value="0" aria-label="Progreso">
      <div class="times"><span id="stC">0:00</span><span id="stD">0:00</span></div>
      <div class="stctl"><button class="icb" id="stBack" data-act="stBack" aria-label="Retroceder 10 segundos"></button><button class="play" id="stP" data-act="stToggle" aria-label="Reproducir o pausar"></button><button class="icb" id="stFwd" data-act="stFwd" aria-label="Adelantar 10 segundos"></button></div>
      <div class="pills"><button class="pill" id="stSpd" data-act="stSpeed">1x</button><button class="pill" id="stAud" data-act="stAudio">Solo audio</button><button class="pill" data-act="stClose">Cerrar</button></div>
      <p class="sub" style="text-align:center;margin-top:16px">Si vas a bloquear el iPhone, activa “Solo audio” para que siga sonando. Al terminar, borra el archivo desde Archivos.</p>
    </div>
  </section>
  <div id="mini" data-act="openFull"></div>
  <nav id="nav"></nav>
  <div id="full"></div>
  <div id="pick"></div>
  <div id="sheet"><div class="box"></div></div>
  <div id="toast"></div>
</div>
<audio id="au" preload="auto" playsinline></audio>
<audio id="sa" preload="metadata" playsinline></audio>
<input type="file" id="fSongs" multiple accept="audio/*,.mp3,.m4a,.mp4,.aac,.wav,.flac" hidden>
<input type="file" id="fBackup" accept=".json,application/json" hidden>
<input type="file" id="fStudy" accept="video/*,audio/*,.mp4,.mov,.m4v,.mp3,.m4a" hidden>
<script src="jsmediatags.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const P={
 play:'<polygon points="6 3 20 12 6 21 6 3"/>',
 pause:'<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>',
 next:'<polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/>',
 prev:'<polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/>',
 shuffle:'<polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/>',
 repeat:'<polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',
 repeat1:'<polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/><path d="M11 10h1v4"/>',
 down:'<polyline points="6 9 12 15 18 9"/>',
 left:'<polyline points="15 18 9 12 15 6"/>',
 right:'<polyline points="9 18 15 12 9 6"/>',
 plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
 music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
 list:'<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>',
 sliders:'<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>',
 more:'<circle cx="12" cy="5" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="12" cy="19" r="1.3"/>',
 check:'<polyline points="20 6 9 17 4 12"/>',
 rew:'<polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/><text x="12" y="15.5" text-anchor="middle" font-size="8" stroke="none" fill="currentColor" font-weight="700">10</text>',
 fwd:'<polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/><text x="12" y="15.5" text-anchor="middle" font-size="8" stroke="none" fill="currentColor" font-weight="700">10</text>',
 book:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
 headphones:'<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>'
};
const I=(n,f,s)=>'<svg class="ic'+(f?' f':'')+'" viewBox="0 0 24 24"'+(s?' style="width:'+s+'px;height:'+s+'px"':'')+' aria-hidden="true">'+P[n]+'</svg>';

let db;
function openDb(){return new Promise((res,rej)=>{const r=indexedDB.open('musica-local',2);r.onupgradeneeded=()=>{const d=r.result,has=n=>d.objectStoreNames.contains(n);if(!has('songs'))d.createObjectStore('songs',{keyPath:'id'});if(!has('blobs'))d.createObjectStore('blobs');if(!has('playlists'))d.createObjectStore('playlists',{keyPath:'id'});if(!has('meta'))d.createObjectStore('meta',{keyPath:'k'});if(!has('covers'))d.createObjectStore('covers');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function req(store,mode,fn){return new Promise((res,rej)=>{const t=db.transaction(store,mode);const r=fn(t.objectStore(store));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('abort'));});}
const dbAll=s=>req(s,'readonly',o=>o.getAll());
const dbGet=(s,k)=>req(s,'readonly',o=>o.get(k));
const dbPut=(s,v,k)=>req(s,'readwrite',o=>k===undefined?o.put(v):o.put(v,k));
const dbDel=(s,k)=>req(s,'readwrite',o=>o.delete(k));

let songs=[],byId=new Map(),lists=[],cfg={ac:'t'};
let view='songs',curList=null,shuffle=false,repeat='off',seeking=false,loadTk=0,curURL=null,toastT=null;
const Q={ids:[],order:[],pos:0,cur:null};
const au=$('#au');
const curL=()=>lists.find(x=>x.id===curList);
const listIds=l=>l.keys.filter(k=>byId.has(k));
const fmt=t=>{if(!isFinite(t))return'0:00';t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');};
const mb=b=>b>=1073741824?(b/1073741824).toFixed(2)+' GB':Math.round(b/1048576)+' MB';
const sortSongs=()=>songs.sort((a,b)=>a.title.localeCompare(b.title,'es',{sensitivity:'base'}));
function parse(name){const n=name.replace(/\.[^.]+$/,'').replace(/_/g,' ').trim();let a='Desconocido',t=n;const m=n.split(' - ');if(m.length>1){a=m[0].trim();t=m.slice(1).join(' - ').trim();}return{title:t||n,artist:a};}
function toast(msg,sticky){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);if(!sticky)toastT=setTimeout(()=>t.classList.remove('show'),2600);}
function saveCfg(){return dbPut('meta',{k:'cfg',ac:cfg.ac,shuffle,repeat});}
function applyAc(){document.documentElement.dataset.ac=cfg.ac==='g'?'green':'teal';}

function buildShell(){
 $('#nav').innerHTML='<button data-act="tab" data-v="songs">'+I('music')+'<span>Canciones</span></button><button data-act="tab" data-v="lists">'+I('list')+'<span>Playlists</span></button><button data-act="tab" data-v="study">'+I('book')+'<span>Estudio</span></button><button data-act="tab" data-v="set">'+I('sliders')+'<span>Ajustes</span></button>';
 $('#stBack').innerHTML=I('rew',0,36);$('#stFwd').innerHTML=I('fwd',0,36);$('#stEmptyIc').innerHTML=I('book',0,40);$('#aOnlyIc').innerHTML=I('headphones',0,44);
 $('#mini').innerHTML='<div class="cov sm" id="mCov">'+I('music',0,18)+'</div><div class="meta"><div class="t" id="mT"></div><div class="s" id="mA"></div></div><button class="icb" id="mP" data-act="toggle" aria-label="Reproducir o pausar"></button><button class="icb" data-act="next" aria-label="Siguiente">'+I('next',1,22)+'</button><div class="mbar"><i id="mBar"></i></div>';
 $('#full').innerHTML='<button class="icb" data-act="closeFull" style="align-self:flex-start" aria-label="Cerrar">'+I('down',0,30)+'</button><div class="bigwrap"><div class="bigcov" id="fCov">'+I('music',0,96)+'</div></div><div class="ft" id="fT"></div><div class="fa" id="fA"></div><input type="range" id="fSeek" min="0" max="1000" value="0" aria-label="Progreso"><div class="times"><span id="fC">0:00</span><span id="fD">0:00</span></div><div class="ctl"><button class="icb" id="fS" data-act="shuf" aria-label="Aleatorio">'+I('shuffle',0,24)+'</button><button class="icb" data-act="prev" aria-label="Anterior" style="color:var(--txt)">'+I('prev',1,30)+'</button><button class="play" id="fP" data-act="toggle" aria-label="Reproducir o pausar"></button><button class="icb" data-act="next" aria-label="Siguiente" style="color:var(--txt)">'+I('next',1,30)+'</button><button class="icb" id="fR" data-act="rep" aria-label="Repetir"></button></div>';
 $('#pick').innerHTML='<div class="top"><h1>Agregar canciones</h1><button class="btn" data-act="pickDone">Listo</button></div><div id="pickList"></div>';
 const sk=$('#fSeek');
 sk.addEventListener('input',()=>{seeking=true;const d=au.duration;if(d&&isFinite(d)){au.currentTime=sk.value/1000*d;}sk.style.setProperty('--p',(sk.value/10)+'%');$('#fC').textContent=fmt(au.currentTime);});
 sk.addEventListener('change',()=>{seeking=false;});
}

function render(){
 const v=$('#view'),study=view==='study';
 $('#app').classList.toggle('study',study);$('#study').classList.toggle('on',study);v.style.display=study?'none':'';
 if(study){stSync();}
 else if(view==='songs')v.innerHTML=vSongs();
 else if(view==='lists')v.innerHTML=vLists();
 else if(view==='pl')v.innerHTML=vPl();
 else{v.innerHTML=vSet();fillStorage();}
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===(view==='pl'?'lists':view)));
}
function empty(t,s){return '<div class="empty"><div class="ei">'+I('music',0,40)+'</div><div class="et">'+t+'</div><div>'+s+'</div></div>';}
function rowSong(s){return '<div class="row'+(s.id===Q.cur?' cur':'')+'" data-act="playSong" data-song="1" data-id="'+esc(s.id)+'"><div class="cov">'+(s.thumb?'<img src="'+s.thumb+'" alt="">':I('music',0,20))+'</div><div class="meta"><div class="t">'+esc(s.title)+'</div><div class="s">'+esc(s.artist)+'</div></div><button class="icb" data-act="songMenu" data-id="'+esc(s.id)+'" aria-label="Más opciones">'+I('more',1,20)+'</button></div>';}
function vSongs(){
 const top='<div class="top"><h1>Canciones</h1><button class="btn" data-act="addSongs">'+I('plus',0,16)+' Agregar</button></div>';
 if(!songs.length)return top+empty('Tu biblioteca está vacía','Agrega archivos de audio desde tu iPhone para empezar.');
 return top+'<div class="sub">'+songs.length+' canciones</div>'+songs.map(rowSong).join('');
}
function listThumb(l){
 const ids=listIds(l);if(!ids.length)return null;
 const f=byId.get(ids[0]);if(f&&f.thumb)return f.thumb;
 for(const k of ids){const x=byId.get(k);if(x&&x.thumb)return x.thumb;}
 return null;
}
function vLists(){

let coverURL=null;
function readTags(src){return new Promise(res=>{if(!window.jsmediatags){res(null);return;}const to=setTimeout(()=>res(null),5000);const done=v=>{clearTimeout(to);res(v);};try{window.jsmediatags.read(src,{onSuccess:t=>done(t&&t.tags||null),onError:()=>done(null)});}catch(e){done(null);}});}
function makeCover(pic){return Promise.race([makeCover0(pic),new Promise(r=>setTimeout(()=>r(null),6000))]);}
async function makeCover0(pic){
 try{
  const src=new Blob([new Uint8Array(pic.data)],{type:pic.format||'image/jpeg'});
  let img;
  if(window.createImageBitmap){img=await createImageBitmap(src);}
  else{img=await new Promise((res,rej)=>{const u=URL.createObjectURL(src),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i);};i.onerror=rej;i.src=u;});}
  const w=img.width,h=img.height,m=Math.min(w,h),sx=(w-m)/2,sy=(h-m)/2;
  const draw=n=>{const c=document.createElement('canvas');c.width=c.height=n;c.getContext('2d').drawImage(img,sx,sy,m,m,0,0,n,n);return c;};
  const big=await new Promise(r=>draw(512).toBlob(r,'image/jpeg',.85));
  const thumb=draw(96).toDataURL('image/jpeg',.7);
  if(img.close)img.close();
  return big?{big,thumb}:null;
 }catch(e){return null;}
}
async function enrich(s,src){
 const t=await readTags(src);if(!t)return false;
 let ch=false;
 if(!s.edited){
  if(t.title&&String(t.title).trim()){s.title=String(t.title).trim();ch=true;}
  if(t.artist&&String(t.artist).trim()){s.artist=String(t.artist).trim();ch=true;}
 }
 if(t.picture&&!s.thumb){const c=await makeCover(t.picture);if(c){s.thumb=c.thumb;await dbPut('covers',c.big,s.id);ch=true;}}
 return ch;
}

 SM.mode=SM.mode==='video'?'audio':'video';
 const to=sm();
 if(to.getAttribute('src')!==SM.url)to.src=SM.url;
 to.playbackRate=SM.speed;
 SM.pendingT=t;
 try{to.currentTime=t;}catch(e){}
 if(to.readyState>=1){SM.pendingT=null;}
 if(was)to.play().catch(()=>{});
 stSync();
}
[vd,sa].forEach(el=>{
 el.addEventListener('play',e=>{if(e.target!==sm())return;if(!au.paused)au.pause();e.target.playbackRate=SM.speed;bindMS('study');stSetMeta();stSync();try{navigator.mediaSession.playbackState='playing';}catch(x){}});
 el.addEventListener('pause',e=>{if(e.target!==sm())return;saveStudy();stSync();try{navigator.mediaSession.playbackState='paused';}catch(x){}});
 el.addEventListener('timeupdate',e=>{if(e.target===sm())stProgress();});
 el.addEventListener('loadedmetadata',e=>{if(e.target===sm())onStudyMeta(e.target);});
 el.addEventListener('ended',e=>{if(e.target!==sm())return;delete studyMap[SM.key];saveStudy();stSync();toast('Terminaste este archivo. Si ya no lo necesitas, bórralo desde Archivos');});
 el.addEventListener('error',e=>{if(e.target===sm()&&e.target.getAttribute('src'))toast('No se pudo reproducir este archivo. Prueba con MP4');});
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveStudy();});
window.addEventListener('pagehide',saveStudy);
(function(){
 const sk=$('#stSeek');
 sk.addEventListener('input',()=>{stSeeking=true;const el=sm(),d=el.duration;if(SM.url&&d&&isFinite(d))el.currentTime=sk.value/1000*d;sk.style.setProperty('--p',(sk.value/10)+'%');$('#stC').textContent=fmt(sm().currentTime);});
 sk.addEventListener('change',()=>{stSeeking=false;});
})();

const A={
 tab(el){view=el.dataset.v;curList=null;render();$('#view').scrollTop=0;},
 addSongs(){$('#fSongs').click();},
 playSong(el,id){playCtx(view==='pl'?listIds(curL()):songs.map(s=>s.id),id);},
 songMenu(el,id){
  const s=byId.get(id);if(!s)return;
  const items=[{l:'Agregar a playlist',f:()=>chooseList(id)},{l:'Editar título y artista',f:()=>editSong(id)}];
  if(view==='pl')items.push({l:'Quitar de esta playlist',f:()=>{const l=curL();l.keys=l.keys.filter(k=>k!==id);dbPut('playlists',l);render();}});
  items.push({l:'Eliminar de la biblioteca',d:1,f:()=>delSong(id)});
  sheet(s.title,items);
 },
 openList(el,id){curList=id;view='pl';render();$('#view').scrollTop=0;},
 back(){curList=null;view='lists';render();},
 newList(){const l=newList();if(l)render();},
 plMenu(){
  const l=curL();if(!l)return;
  sheet(l.name,[
   {l:'Cambiar nombre',f:()=>{const n=prompt('Nuevo nombre',l.name);if(n&&n.trim()){l.name=n.trim();dbPut('playlists',l);render();}}},
   {l:'Eliminar playlist',d:1,f:()=>{if(confirm('¿Eliminar la playlist “'+l.name+'”? Las canciones se quedan en tu biblioteca.')){lists=lists.filter(x=>x.id!==l.id);dbDel('playlists',l.id);curList=null;view='lists';render();}}}
  ]);
 },
 addToPl(){openPicker(curList);},
 playAll(){playCtx(listIds(curL()),null,false);},
 shufAll(){playCtx(listIds(curL()),null,true);},
 openFull(){$('#full').classList.add('open');},
 closeFull(){$('#full').classList.remove('open');},
 toggle(){toggle();},
 next(){next(false);},
 prev(){prev();},
 shuf(){shuffle=!shuffle;saveCfg();if(Q.cur)buildOrder(Q.cur);sync();},
 rep(){repeat={off:'all',all:'one',one:'off'}[repeat];saveCfg();sync();},
 setAc(el){cfg.ac=el.dataset.v;applyAc();saveCfg();render();},
 exp(){exportBackup();},
 stPick(){$('#fStudy').click();},
 stToggle(){stToggle();},
 stBack(){stSkip(-10);},
 stFwd(){stSkip(10);},
 stSpeed(){stSpeed();},
 stAudio(){stToggleAudio();},
 stClose(){stopStudy();},
 refreshTags(){refreshTags();},
 imp(){$('#fBackup').click();},
 async persist(){
  try{const ok=await navigator.storage.persist();toast(ok?'Almacenamiento protegido':'iOS no lo concedió. Instala la app en la pantalla de inicio e inténtalo de nuevo');}catch(e){toast('Este navegador no permite protegerlo');}
  fillStorage();
 },
 pickToggle(el,id){
  if(pickSet.has(id))pickSet.delete(id);else pickSet.add(id);
  const c=el.querySelector('.chk'),on=pickSet.has(id);
  c.classList.toggle('on',on);c.innerHTML=on?I('check',0,14):'';
 },
 pickDone(){pickDone();}
};
document.addEventListener('click',e=>{
 const sh=e.target.closest('[data-sheet]');
 if(sh){const it=(window.sheetItems||[])[+sh.dataset.sheet];closeSheet();if(it)it.f();return;}
 if(e.target.id==='sheet'){closeSheet();return;}
 const el=e.target.closest('[data-act]');if(!el)return;
 const f=A[el.dataset.act];if(f)f(el,el.dataset.id);
});
$('#fSongs').addEventListener('change',async e=>{const f=Array.from(e.target.files);e.target.value='';if(f.length)await addFiles(f);});
$('#fStudy').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)stPickFile(f);});
$('#fBackup').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(f)await importBackup(f);});

async function init(){
 db=await openDb();
 songs=await dbAll('songs');lists=await dbAll('playlists');
 const c=await dbGet('meta','cfg');
 const st=await dbGet('meta','study');studyMap=(st&&st.map)||{};
 if(c){cfg.ac=c.ac||'t';shuffle=!!c.shuffle;repeat=c.repeat||'off';}
 songs.forEach(s=>byId.set(s.id,s));sortSongs();lists.sort((a,b)=>a.created-b.created);
 applyAc();buildShell();bindMS();render();sync();
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
init().catch(e=>{document.body.insertAdjacentHTML('beforeend','<p style="padding:20px">No se pudo iniciar el almacenamiento de la app: '+esc((e&&e.message)||e)+'. Si estás en navegación privada, ábrela en una pestaña normal.</p>');});
</script>
