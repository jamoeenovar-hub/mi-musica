<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Música">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Mi Música</title>
<style>
:root{--bg:#000;--card:#121212;--card2:#1f1f1f;--line:#2a2a2a;--txt:#f2f2f2;--mut:#a7a7a7;--ac:#2dd4bf;--on:#04201d;--danger:#f0716b}
html[data-ac="green"]{--ac:#1db954}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overscroll-behavior:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100%;height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative;overflow:hidden}
#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 14px) 16px 12px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.top h1,.phead h1{font-size:24px;font-weight:600;margin:0;letter-spacing:-.01em}
.sub{font-size:12px;color:var(--mut);margin:2px 0 6px}
.btn{background:var(--ac);color:var(--on);border:0;border-radius:22px;padding:9px 16px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:var(--card2);color:var(--txt)}
.btn.wide{width:100%;margin:10px 0 6px}
.btn.danger{background:var(--card2);color:var(--danger)}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.f{fill:currentColor}
.icb{background:none;border:0;color:var(--mut);padding:6px;display:flex;align-items:center;justify-content:center}
.icb.on{color:var(--ac)}
.row{display:flex;align-items:center;gap:12px;padding:8px 0;cursor:pointer}
.row.big{padding:12px 0}
.row.miss{opacity:.5;cursor:default}
.cov{width:44px;height:44px;border-radius:8px;background:color-mix(in srgb,var(--ac) 22%,var(--card));color:var(--ac);display:flex;align-items:center;justify-content:center;flex:none}
.cov.big{width:62px;height:62px;border-radius:12px}
.cov.sm{width:38px;height:38px}
.meta{flex:1;min-width:0}
.t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.big .t{font-size:16px}
.row.cur .t{color:var(--ac)}
.row.cur .cov{background:var(--ac);color:var(--on)}
.chev{color:var(--mut);display:flex}
.phead{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.phead .meta h1{white-space:normal}
.acts{display:flex;gap:10px}
.empty{text-align:center;padding:60px 20px;color:var(--mut)}
.empty .ei{color:var(--ac);display:flex;justify-content:center;margin-bottom:10px}
.empty .et{color:var(--txt);font-weight:500;font-size:17px;margin-bottom:4px}
.sec{background:var(--card);border-radius:14px;padding:14px;margin-bottom:14px}
.sec h2{font-size:15px;font-weight:600;margin:0 0 4px}
.sec p{font-size:13px;color:var(--mut);margin:0 0 10px}
.chips{display:flex;gap:10px}
.chip{flex:1;background:var(--card2);border:2px solid transparent;border-radius:12px;padding:12px;display:flex;align-items:center;gap:8px;font-weight:500}
.chip.on{border-color:var(--ac)}
.dot{width:16px;height:16px;border-radius:50%;flex:none}
.pre{white-space:pre-line;font-size:13px;color:var(--mut);margin:0 0 10px}
#mini{display:none;margin:0 8px 6px;background:var(--card2);border-radius:12px;padding:8px 10px;align-items:center;gap:10px;position:relative;cursor:pointer;overflow:hidden}
#mini.on{display:flex}
#mini .icb{color:var(--txt)}
.mbar{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--line)}
.mbar i{display:block;height:2px;width:0;background:var(--ac)}
#nav{display:flex;border-top:1px solid var(--line);padding:6px 0 calc(env(safe-area-inset-bottom) + 4px);background:var(--bg)}
#nav button{flex:1;background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:4px 0}
#nav button.on{color:var(--ac)}
#full{position:absolute;inset:0;background:var(--bg);transform:translateY(102%);transition:transform .3s ease;z-index:20;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 24px calc(env(safe-area-inset-bottom) + 24px)}
#full.open{transform:none}
.bigwrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.bigcov{width:min(76vw,320px);aspect-ratio:1;border-radius:18px;background:color-mix(in srgb,var(--ac) 22%,var(--card));color:var(--ac);display:flex;align-items:center;justify-content:center}
.ft{font-size:21px;font-weight:600;margin-top:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fa{font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:linear-gradient(to right,var(--ac) var(--p,0%),var(--line) var(--p,0%));outline:none;margin:20px 0 8px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--txt)}
.times{display:flex;justify-content:space-between;font-size:11px;color:var(--mut)}
.ctl{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.play{width:64px;height:64px;border-radius:50%;background:var(--ac);color:var(--on);border:0;display:flex;align-items:center;justify-content:center}
#sheet{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none;align-items:flex-end}
#sheet.on{display:flex}
#sheet .box{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:10px 8px calc(env(safe-area-inset-bottom) + 10px);max-height:75%;overflow:auto}
.sh{padding:8px 12px 10px;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it{padding:14px 12px;border-radius:10px;font-size:16px}
.it:active{background:var(--card2)}
.it.danger{color:var(--danger)}
#pick{position:absolute;inset:0;background:var(--bg);z-index:35;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 16px 0}
#pick.on{display:flex}
#pickList{flex:1;overflow-y:auto;padding-bottom:calc(env(safe-area-inset-bottom) + 12px)}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--mut);display:flex;align-items:center;justify-content:center;flex:none;color:var(--on)}
.chk.on{background:var(--ac);border-color:var(--ac)}
#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 130px);transform:translateX(-50%);background:var(--card2);padding:10px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:90%;text-align:center}
#toast.show{opacity:1}
.cov{overflow:hidden}
.cov img{width:100%;height:100%;object-fit:cover;display:block}
.row.cur .cov{box-shadow:0 0 0 2px var(--ac)}
.bigcov{overflow:hidden}
.bigcov img{width:100%;height:100%;object-fit:cover;display:block}
#study{display:none;flex:1;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 14px) 16px 12px}
#study.on{display:flex}
#app.study #mini{display:none!important}
.vwrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.vwrap video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.aonly{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:6px;background:var(--card);color:var(--ac);font-size:14px}
.stctl{display:flex;align-items:center;justify-content:center;gap:34px;margin:18px 0 14px}
.stctl .icb{color:var(--txt)}
.pills{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pill{background:var(--card2);color:var(--txt);border:0;border-radius:20px;padding:9px 16px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.pill.on{background:var(--ac);color:var(--on)}
.crumb{font-size:13px;color:var(--mut);margin:2px 0 4px}
.crumb span{cursor:pointer}
.h1{font-size:26px;font-weight:700;margin:0;letter-spacing:-.01em}
#fcr,#fce{position:absolute;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 10px)}
#fcr.on,#fce.on{display:flex}
.rvtop{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.rvtitle{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:center}
.rvcount{font-size:12px;color:var(--mut);min-width:64px;text-align:right}
.icb.tx{color:var(--txt);font-size:15px;padding:8px 4px}
.rvbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 4px;text-align:center}
.rvbody.left{text-align:left}
.rvimg{max-width:100%;max-height:38vh;border-radius:10px;display:block;margin:0 auto 10px;background:var(--card)}
.rvtxt{font-size:22px;font-weight:600;white-space:pre-wrap;margin:8px 0;line-height:1.3}
.rvhr{height:1px;background:var(--line);margin:20px 0}
.rvbar{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.btn.big{width:100%;padding:15px;font-size:16px}
.gbtn{flex:1;background:none;border:0;border-top:2px solid currentColor;padding:12px 2px;font-weight:700;font-size:14px;letter-spacing:.03em}
.gbtn small{display:block;font-weight:400;color:var(--mut);font-size:11px;margin-top:3px;letter-spacing:0}
.say{margin:6px auto}
.fsec{background:var(--card);border-radius:14px;padding:12px;margin-bottom:12px}
.fsec h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:0 0 8px}
textarea,input[type=text]{width:100%;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:16px}
textarea{min-height:84px;resize:vertical}
.slot{display:flex;align-items:center;gap:10px;margin-top:8px}
.slot img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.slot audio{flex:1;min-width:0;height:36px}
</style>
</head>
<body>
<div id="app">
  <main id="view"></main>
  <section id="study">
    <div class="top"><button class="icb" id="stMenuBtn" data-act="stMenu" aria-label="Volver"></button><h1>Reproductor</h1><button class="btn ghost" data-act="stPick">Elegir archivo</button></div>
    <div id="stEmpty" class="empty"><div class="ei" id="stEmptyIc"></div><div class="et">Nada reproduciéndose</div><div>Elige un video o audio de tu iPhone. Se reproduce directo desde Archivos y no se guarda en la app.</div></div>
    <div id="stMain" style="display:none;flex-direction:column">
      <div class="s" id="stName" style="margin-bottom:8px"></div>
      <div class="vwrap" data-act="stToggle"><video id="vd" playsinline preload="metadata"></video><div id="aOnly" class="aonly"><div id="aOnlyIc"></div><div>Solo audio</div></div></div>
      <input type="range" id="stSeek" min="0" max="1000" value="0" aria-label="Progreso">
      <div class="times"><span id="stC">0:00</span><span id="stD">0:00</span></div>
      <div class="stctl"><button class="icb" id="stBack" data-act="stBack" aria-label="Retroceder 10 segundos"></button><button class="play" id="stP" data-act="stToggle" aria-label="Reproducir o pausar"></button><button class="icb" id="stFwd" data-act="stFwd" aria-label="Adelantar 10 segundos"></button></div>
      <div class="pills"><button class="pill" id="stSpd" data-act="stSpeed">1x</button><button class="pill" id="stAud" data-act="stAudio">Solo audio</button><button class="pill" data-act="stClose">Cerrar</button></div>
      <p class="sub" style="text-align:center;margin-top:16px">Si vas a bloquear el iPhone, activa “Solo audio” para que siga sonando. Al terminar, borra el archivo desde Archivos.</p>
    </div>
  </section>
  <div id="mini" data-act="openFull"></div>
  <nav id="nav"></nav>
  <div id="full"></div>
  <div id="pick"></div>
  <div id="fcr"></div>
  <div id="fce"></div>
  <div id="sheet"><div class="box"></div></div>
  <div id="toast"></div>
</div>
<audio id="au" preload="auto" playsinline></audio>
<audio id="sa" preload="metadata" playsinline></audio>
<audio id="rvAu" preload="auto" playsinline></audio>
<input type="file" id="fSongs" multiple accept="audio/*,.mp3,.m4a,.mp4,.aac,.wav,.flac" hidden>
<input type="file" id="fBackup" accept=".json,application/json" hidden>
<input type="file" id="fImg" accept="image/*" hidden>
<input type="file" id="fAud" accept="audio/*,.mp3,.m4a,.aac,.wav" hidden>
<input type="file" id="fStudy" accept="video/*,audio/*,.mp4,.mov,.m4v,.mp3,.m4a" hidden>
<script src="jsmediatags.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const P={
 play:'<polygon points="6 3 20 12 6 21 6 3"/>',
 pause:'<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>',
 next:'<polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/>',
 prev:'<polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/>',
 shuffle:'<polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/>',
 repeat:'<polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',
 repeat1:'<polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/><path d="M11 10h1v4"/>',
 down:'<polyline points="6 9 12 15 18 9"/>',
 left:'<polyline points="15 18 9 12 15 6"/>',
 right:'<polyline points="9 18 15 12 9 6"/>',
 plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
 music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
 list:'<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>',
 sliders:'<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>',
 more:'<circle cx="12" cy="5" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="12" cy="19" r="1.3"/>',
 check:'<polyline points="20 6 9 17 4 12"/>',
 rew:'<polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/><text x="12" y="15.5" text-anchor="middle" font-size="8" stroke="none" fill="currentColor" font-weight="700">10</text>',
 fwd:'<polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/><text x="12" y="15.5" text-anchor="middle" font-size="8" stroke="none" fill="currentColor" font-weight="700">10</text>',
 book:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
 cards:'<rect x="2" y="7" width="15" height="13" rx="2"/><path d="M7 7V5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-3"/>',
 folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
 image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>',
 volume:'<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>',
 headphones:'<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>'
};
const I=(n,f,s)=>'<svg class="ic'+(f?' f':'')+'" viewBox="0 0 24 24"'+(s?' style="width:'+s+'px;height:'+s+'px"':'')+' aria-hidden="true">'+P[n]+'</svg>';

let db;
function openDb(){return new Promise((res,rej)=>{const r=indexedDB.open('musica-local',3);r.onupgradeneeded=()=>{const d=r.result,has=n=>d.objectStoreNames.contains(n);if(!has('songs'))d.createObjectStore('songs',{keyPath:'id'});if(!has('blobs'))d.createObjectStore('blobs');if(!has('playlists'))d.createObjectStore('playlists',{keyPath:'id'});if(!has('meta'))d.createObjectStore('meta',{keyPath:'k'});if(!has('covers'))d.createObjectStore('covers');if(!has('fcnodes'))d.createObjectStore('fcnodes',{keyPath:'id'});if(!has('fccards'))d.createObjectStore('fccards',{keyPath:'id'});if(!has('fcmedia'))d.createObjectStore('fcmedia',{keyPath:'id'});};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function req(store,mode,fn){return new Promise((res,rej)=>{const t=db.transaction(store,mode);const r=fn(t.objectStore(store));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('abort'));});}
const dbAll=s=>req(s,'readonly',o=>o.getAll());
const dbGet=(s,k)=>req(s,'readonly',o=>o.get(k));
const dbPut=(s,v,k)=>req(s,'readwrite',o=>k===undefined?o.put(v):o.put(v,k));
const dbDel=(s,k)=>req(s,'readwrite',o=>o.delete(k));

let songs=[],byId=new Map(),lists=[],cfg={ac:'t'};
let view='songs',curList=null,shuffle=false,repeat='off',seeking=false,loadTk=0,curURL=null,toastT=null;
const Q={ids:[],order:[],pos:0,cur:null};
const au=$('#au');
const curL=()=>lists.find(x=>x.id===curList);
const listIds=l=>l.keys.filter(k=>byId.has(k));
const fmt=t=>{if(!isFinite(t))return'0:00';t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');};
const mb=b=>b>=1073741824?(b/1073741824).toFixed(2)+' GB':Math.round(b/1048576)+' MB';
const sortSongs=()=>songs.sort((a,b)=>a.title.localeCompare(b.title,'es',{sensitivity:'base'}));
function parse(name){const n=name.replace(/\.[^.]+$/,'').replace(/_/g,' ').trim();let a='Desconocido',t=n;const m=n.split(' - ');if(m.length>1){a=m[0].trim();t=m.slice(1).join(' - ').trim();}return{title:t||n,artist:a};}
function toast(msg,sticky){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);if(!sticky)toastT=setTimeout(()=>t.classList.remove('show'),2600);}
function saveCfg(){return dbPut('meta',{k:'cfg',ac:cfg.ac,shuffle,repeat});}
function applyAc(){document.documentElement.dataset.ac=cfg.ac==='g'?'green':'teal';}

function buildShell(){
 $('#nav').innerHTML='<button data-act="tab" data-v="songs">'+I('music')+'<span>Canciones</span></button><button data-act="tab" data-v="lists">'+I('list')+'<span>Playlists</span></button><button data-act="tab" data-v="study">'+I('book')+'<span>Estudio</span></button><button data-act="tab" data-v="set">'+I('sliders')+'<span>Ajustes</span></button>';

async function addFiles(files){
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
 let n=0,skip=0;
 for(let i=0;i<files.length;i++){
  const f=files[i],id=f.name+'|'+f.size;
  if(byId.has(id)){skip++;continue;}
  toast('Agregando '+(i+1)+' de '+files.length+'…',true);
  try{
   const buf=await f.arrayBuffer();
   const blob=new Blob([buf],{type:f.type||'audio/mp4'});
   const pr=parse(f.name);
   const s={id,title:pr.title,artist:pr.artist,size:f.size,added:Date.now()};
   await enrich(s,f);
   await dbPut('blobs',blob,id);await dbPut('songs',s);
   songs.push(s);byId.set(id,s);n++;
  }catch(e){
   console.error(e);
   toast(e&&e.name==='QuotaExceededError'?'Sin espacio para guardar más canciones':'No se pudo guardar '+f.name);
   break;
  }
 }
 sortSongs();render();
 if(n||skip)toast(n+' agregadas'+(skip?' · '+skip+' ya estaban':''));
}

function buildOrder(startId){
 if(shuffle){const rest=Q.ids.filter(x=>x!==startId);for(let i=rest.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[rest[i],rest[j]]=[rest[j],rest[i]];}Q.order=[startId].concat(rest);Q.pos=0;}
 else{Q.order=Q.ids.slice();Q.pos=Math.max(0,Q.order.indexOf(startId));}
}
function playCtx(ids,start,shuf){
 if(!ids.length){toast('No hay canciones para reproducir');return;}
 if(typeof shuf==='boolean'){shuffle=shuf;saveCfg();}
 Q.ids=ids.slice();
 const startId=start||(shuffle?ids[Math.floor(Math.random()*ids.length)]:ids[0]);
 buildOrder(startId);loadCur();
}
async function loadCur(){
 const id=Q.order[Q.pos];if(!id)return;
 const tk=++loadTk;Q.cur=id;
 const blob=await dbGet('blobs',id);
 if(tk!==loadTk)return;
 if(!blob){toast('No se encontró el audio de esta canción');return;}
 if(curURL)URL.revokeObjectURL(curURL);
 curURL=URL.createObjectURL(blob);
 au.src=curURL;
 try{await au.play();}catch(e){console.warn(e);}
 bindMS('music');setMeta();sync();markCur();
 await loadCover(id,tk);
}
function next(auto){
 if(!Q.order.length)return;
 if(auto&&repeat==='one'){au.currentTime=0;au.play().catch(()=>{});return;}
 if(Q.pos<Q.order.length-1){Q.pos++;loadCur();return;}
 if(auto&&repeat==='off'){au.pause();au.currentTime=0;sync();return;}
 if(shuffle){const o=Q.ids.filter(x=>x!==Q.cur);buildOrder(o.length?o[Math.floor(Math.random()*o.length)]:Q.cur);}else Q.pos=0;
 loadCur();
}
function prev(){
 if(!Q.order.length)return;
 if(au.currentTime>3){au.currentTime=0;return;}
 Q.pos=Q.pos>0?Q.pos-1:Q.order.length-1;
 loadCur();
}

let CTX='music';
function bindMS(c){
 if(c)CTX=c;
 if(!('mediaSession' in navigator))return;
 const m=navigator.mediaSession,h=(a,f)=>{try{m.setActionHandler(a,f);}catch(e){}};
 if(CTX==='study'){
  h('play',()=>sm().play().catch(()=>{}));h('pause',()=>sm().pause());

  h('seekto',d=>{if(d&&d.seekTime!=null)sm().currentTime=d.seekTime;});

 }else{
  h('play',()=>au.play().catch(()=>{}));h('pause',()=>au.pause());
  h('previoustrack',prev);h('nexttrack',()=>next(false));
  h('seekbackward',null);h('seekforward',null);h('seekto',null);
  try{m.setPositionState();}catch(e){}
 }
}

async function exportBackup(){
 const data={app:'mi-musica',v:1,date:new Date().toISOString(),ac:cfg.ac,playlists:lists.map(l=>({name:l.name,keys:l.keys}))};
 const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
 const name='mi-musica-respaldo-'+new Date().toISOString().slice(0,10)+'.json';
 try{
  const file=new File([blob],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return;}
 }catch(e){if(e&&e.name==='AbortError')return;}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
async function importBackup(file){
 try{
  const d=JSON.parse(await file.text());
  if(d.app==='mi-musica'&&d.type==='flashcards'){await fcImport(d,view==='fc'?fcCur:null);return;}
  if(d.app!=='mi-musica'||!Array.isArray(d.playlists))throw new Error('formato');
  let np=0;
  for(const p of d.playlists){
   let l=lists.find(x=>x.name===p.name);
   if(!l){l={id:uid(),name:p.name,keys:[],created:Date.now()};lists.push(l);np++;}
   (p.keys||[]).forEach(k=>{if(!l.keys.includes(k))l.keys.push(k);});
   await dbPut('playlists',l);
  }
  if(d.ac==='t'||d.ac==='g'){cfg.ac=d.ac;applyAc();saveCfg();}
  const miss=new Set();lists.forEach(l=>l.keys.forEach(k=>{if(!byId.has(k))miss.add(k);}));
  render();toast('Respaldo importado: '+np+' playlists nuevas'+(miss.size?' · faltan '+miss.size+' canciones por cargar':''));
 }catch(e){toast('Ese archivo no es un respaldo válido de Mi Música');}
}

let coverURL=null;
function readTags(src){return new Promise(res=>{if(!window.jsmediatags){res(null);return;}const to=setTimeout(()=>res(null),5000);const done=v=>{clearTimeout(to);res(v);};try{window.jsmediatags.read(src,{onSuccess:t=>done(t&&t.tags||null),onError:()=>done(null)});}catch(e){done(null);}});}
function makeCover(pic){return Promise.race([makeCover0(pic),new Promise(r=>setTimeout(()=>r(null),6000))]);}
async function makeCover0(pic){
 try{
  const src=new Blob([new Uint8Array(pic.data)],{type:pic.format||'image/jpeg'});
  let img;
  if(window.createImageBitmap){img=await createImageBitmap(src);}
  else{img=await new Promise((res,rej)=>{const u=URL.createObjectURL(src),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i);};i.onerror=rej;i.src=u;});}
  const w=img.width,h=img.height,m=Math.min(w,h),sx=(w-m)/2,sy=(h-m)/2;
  const draw=n=>{const c=document.createElement('canvas');c.width=c.height=n;c.getContext('2d').drawImage(img,sx,sy,m,m,0,0,n,n);return c;};
  const big=await new Promise(r=>draw(512).toBlob(r,'image/jpeg',.85));
  const thumb=draw(96).toDataURL('image/jpeg',.7);
  if(img.close)img.close();
  return big?{big,thumb}:null;
 }catch(e){return null;}
}
async function enrich(s,src){
 const t=await readTags(src);if(!t)return false;
 let ch=false;
 if(!s.edited){
  if(t.title&&String(t.title).trim()){s.title=String(t.title).trim();ch=true;}
  if(t.artist&&String(t.artist).trim()){s.artist=String(t.artist).trim();ch=true;}
 }
 if(t.picture&&!s.thumb){const c=await makeCover(t.picture);if(c){s.thumb=c.thumb;await dbPut('covers',c.big,s.id);ch=true;}}
 return ch;
}
async function refreshTags(){
 let n=0;
 for(let i=0;i<songs.length;i++){
  const s=songs[i];toast('Leyendo información '+(i+1)+' de '+songs.length+'…',true);
  try{const b=await dbGet('blobs',s.id);if(b&&await enrich(s,b)){await dbPut('songs',s);n++;}}catch(e){console.warn(e);}
 }
 sortSongs();render();sync();setMeta();
 toast(n?n+' canciones actualizadas':'Tus archivos no traen portadas ni artistas nuevos');
}
function editSong(id){
 const s=byId.get(id);if(!s)return;
 const t=prompt('Título',s.title);if(t===null)return;

let fcNodes=[],fcCards=[],fcMeta=new Map(),fcCur=null,fcURL=new Map(),E=null,RV=null;
const DAY=86400000;
const sz=b=>b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
const line1=t=>String(t||'').split('\n')[0];
const withTO=(p,ms,fb)=>Promise.race([p,new Promise(r=>setTimeout(()=>r(fb),ms))]);
const fcNode=id=>fcNodes.find(n=>n.id===id);
const fcChildren=pid=>fcNodes.filter(n=>(n.parent||null)===(pid||null)).sort((a,b)=>a.name.localeCompare(b.name,'es',{sensitivity:'base'}));
function fcSubtree(id){const out=new Set([id]);let add=true;while(add){add=false;fcNodes.forEach(n=>{if(n.parent&&out.has(n.parent)&&!out.has(n.id)){out.add(n.id);add=true;}});}return out;}
const fcCardsIn=id=>{const set=fcSubtree(id);return fcCards.filter(c=>set.has(c.deck));};
function fcPath(id){const p=[];let n=fcNode(id);while(n){p.unshift(n);n=n.parent?fcNode(n.parent):null;}return p;}
function fcStats(id){const cs=id?fcCardsIn(id):fcCards,now=Date.now();return{total:cs.length,due:cs.filter(c=>c.due<=now).length};}
function fmtIvl(ms){const m=ms/60000;if(m<60)return Math.max(1,Math.round(m))+' min';const h=m/60;if(h<24)return Math.round(h)+' h';const d=h/24;if(d<30)return Math.round(d)+' d';if(d<365)return (d/30).toFixed(1).replace('.0','')+' mes';return (d/365).toFixed(1).replace('.0','')+' a';}
function nextSched(c,g){
 const now=Date.now();let ivl=c.ivl||0,ease=c.ease||2.5,state=c.state||'new',lapses=c.lapses||0,reps=c.reps||0,due;
 if(state==='review'){
  if(g===0){lapses++;ease=Math.max(1.3,ease-0.2);ivl=1;state='learn';due=now+10*60000;}
  else if(g===1){ease=Math.max(1.3,ease-0.15);ivl=Math.max(1,ivl*1.2);due=now+Math.round(ivl)*DAY;}
  else if(g===2){ivl=Math.max(ivl+1,ivl*ease);due=now+Math.round(ivl)*DAY;}
  else{ease+=0.15;ivl=Math.max(ivl+1,ivl*ease*1.3);due=now+Math.round(ivl)*DAY;}
  reps++;
 }else{
  if(g===0){state='learn';due=now+10*60000;}
  else{state='review';ivl=g===1?1:g===2?2:4;due=now+ivl*DAY;reps++;}
 }
 if(state==='review')ivl=Math.round(ivl*10)/10;
 return{state,ivl,ease,lapses,reps,due};
}

}

 return await new Promise((res,rej)=>{const u=URL.createObjectURL(blob),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i);};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'));};i.src=u;});

async function compressImage(file,max){
 return withTO((async()=>{
  try{
   const img=await loadBitmap(file),w=img.width,h=img.height,sc=Math.min(1,max/Math.max(w,h));
   const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));
   const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
   if(img.close)img.close();
   const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));
   return b||file;
  }catch(e){return file;}
 })(),6000,file);
}
async function makeThumb(blob,n){
 return withTO((async()=>{
  try{const img=await loadBitmap(blob),w=img.width,h=img.height,m=Math.min(w,h),sx=(w-m)/2,sy=(h-m)/2;const c=document.createElement('canvas');c.width=c.height=n;c.getContext('2d').drawImage(img,sx,sy,m,m,0,0,n,n);if(img.close)img.close();return c.toDataURL('image/jpeg',.7);}catch(e){return null;}
 })(),6000,null);
}

 const old=E[sd][k];
 if(old&&old.id)E.toDelete.push(old.id);else if(old&&old.url)URL.revokeObjectURL(old.url);
 E[sd][k]=slot;fceCollect();fceRender();
}
function fceClose(){
 if(E){for(const sd of ['front','back'])for(const k of ['img','aud']){const sl=E[sd][k];if(sl&&!sl.id&&sl.url)URL.revokeObjectURL(sl.url);}}
 E=null;$('#fce').classList.remove('on');$('#fce').innerHTML='';
}
async function fceSave(){
 fceCollect();
 const has=s=>s.text.trim()||s.img||s.aud;
 if(!has(E.front)&&!has(E.back)){toast('Agrega texto, imagen o audio');return;}
 toast('Guardando…',true);
 try{
  const out={};
  for(const sd of ['front','back']){
   const s=E[sd];out[sd]={text:s.text.trim(),say:s.say.trim(),img:null,aud:null};
   for(const k of ['img','aud']){
    const sl=s[k];if(!sl)continue;
    if(!sl.id){
     const id=uid(),rec={id,kind:k,type:sl.blob.type||'',name:sl.name||'',size:sl.blob.size,created:Date.now(),blob:sl.blob,thumb:null};
     if(k==='img')rec.thumb=await makeThumb(sl.blob,96);
     await dbPut('fcmedia',rec);
     fcMeta.set(id,{id,kind:k,type:rec.type,name:rec.name,size:rec.size,thumb:rec.thumb});
     if(sl.url){fcURL.set(id,sl.url);}
     sl.id=id;
    }
    out[sd][k]=sl.id;
   }
  }
  const ti=out.front.img||out.back.img,th=ti&&fcMeta.get(ti)?fcMeta.get(ti).thumb:null;
  let c=E.id?fcCards.find(x=>x.id===E.id):null;
  if(c){c.front=out.front;c.back=out.back;c.thumb=th||null;}
  else{c={id:uid(),deck:E.deck,front:out.front,back:out.back,thumb:th||null,created:Date.now(),due:0,ivl:0,ease:2.5,reps:0,lapses:0,state:'new'};fcCards.push(c);}
  await dbPut('fccards',c);
  for(const id of E.toDelete)await fcDelMedia(id);
  E=null;$('#fce').classList.remove('on');$('#fce').innerHTML='';
  render();toast('Tarjeta guardada');
 }catch(e){console.error(e);toast(e&&e.name==='QuotaExceededError'?'Sin espacio para guardar':'No se pudo guardar la tarjeta');}
}

// ----- repaso -----
function rvStart(folder,mode,random){
 const now=Date.now();let cs=fcCardsIn(folder);
 if(mode==='due'){cs=cs.filter(c=>c.due<=now).sort((a,b)=>{const an=a.state==='new'?1:0,bn=b.state==='new'?1:0;return an-bn||a.due-b.due||a.created-b.created;});}
 else if(random){for(let i=cs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cs[i],cs[j]]=[cs[j],cs[i]];}}
 else cs.sort((a,b)=>a.created-b.created);
 if(!cs.length){toast(mode==='due'?'No hay tarjetas pendientes ahora':'Esta carpeta no tiene tarjetas');return;}
 RV={folder,mode,queue:cs.map(c=>c.id),total:cs.length,done:0,shown:false};
 $('#fcr').classList.add('on');rvRender();
}
function rvSide(c,side){
 const s=c[side];let h='';
 if(s.img)h+='<img class="rvimg" data-m="'+s.img+'" alt="">';
 if(s.text)h+='<div class="rvtxt">'+esc(s.text)+'</div>';
 if(s.aud||(hasTTS()&&ttsOf(s)))h+='<button class="pill say" data-act="rvSay" data-side="'+side+'">'+I('volume',0,18)+' Escuchar</button>';
 return h;
}
function rvRender(){
 const el=$('#fcr'),title=RV.folder&&fcNode(RV.folder)?fcNode(RV.folder).name:'Flashcards';
 const top='<div class="rvtop"><button class="icb tx" data-act="rvClose">Volver</button><div class="rvtitle">'+esc(title)+'</div><div class="rvcount">'+(RV.queue.length?'Quedan '+RV.queue.length:'')+'</div></div>';
 if(!RV.queue.length){
  el.innerHTML=top+'<div class="rvbody"><div class="empty"><div class="ei">'+I('check',0,40)+'</div><div class="et">¡Listo!</div><div>Revisaste '+RV.done+' tarjetas.</div></div></div><div class="rvbar"><button class="btn big" data-act="rvClose">Cerrar</button></div>';
  return;
 }
 const c=fcCards.find(x=>x.id===RV.queue[0]);
 let body='<div class="rvbody">'+rvSide(c,'front');
 if(RV.shown)body+='<div class="rvhr"></div>'+rvSide(c,'back');
 body+='</div>';
 let bar;
 if(!RV.shown)bar='<div class="rvbar"><button class="btn big" data-act="rvShow">Mostrar respuesta</button></div>';
 else{const now=Date.now();bar='<div class="rvbar">'+[['Falla','#ef5350'],['Difícil','#ff9800'],['Buena','#29b6f6'],['Fácil','#66bb6a']].map((g,i)=>'<button class="gbtn" style="color:'+g[1]+'" data-act="rvGrade" data-g="'+i+'">'+g[0]+(RV.mode==='due'?'<small>'+fmtIvl(nextSched(c,i).due-now)+'</small>':'')+'</button>').join('')+'</div>';}
 el.innerHTML=top+body+bar;
 hydrate($('#fcr'));
 [c.front.aud,c.back.aud].filter(Boolean).forEach(id=>getMediaURL(id));
}
function rvSay(side){
 const c=fcCards.find(x=>x.id===RV.queue[0]);if(!c)return;
 const s=c[side];pauseOthers();
 if(s.aud){
  const a=$('#rvAu'),u=fcURL.get(s.aud),go=url=>{a.src=url;a.play().catch(()=>{});};
  if(u)go(u);else getMediaURL(s.aud).then(x=>{if(x)go(x);});
 }else speak(ttsOf(s));
}
function rvGrade(g){
 const id=RV.queue[0],c=fcCards.find(x=>x.id===id);if(!c)return;
 if(RV.mode==='due'){Object.assign(c,nextSched(c,g));dbPut('fccards',c);}
 RV.queue.shift();
 if(g===0)RV.queue.splice(Math.min(3,RV.queue.length),0,id);else RV.done++;
 RV.shown=false;rvRender();
}
function rvClose(){
 RV=null;$('#fcr').classList.remove('on');$('#fcr').innerHTML='';
 try{$('#rvAu').pause();if(hasTTS())window.speechSynthesis.cancel();}catch(e){}
 render();
}

// ----- exportar / importar -----
async function fcExport(folderId){
 toast('Preparando archivo…',true);
 let nodes,cards;
 if(folderId){const set=fcSubtree(folderId);nodes=fcNodes.filter(n=>set.has(n.id)).map(n=>({id:n.id,parent:n.id===folderId?null:n.parent,name:n.name}));cards=fcCards.filter(c=>set.has(c.deck));}
 else{nodes=fcNodes.map(n=>({id:n.id,parent:n.parent||null,name:n.name}));cards=fcCards.slice();}
 if(!cards.length&&!nodes.length){toast('No hay flashcards para exportar');return;}
 const mids=new Set();cards.forEach(c=>['front','back'].forEach(sd=>['img','aud'].forEach(k=>{if(c[sd][k])mids.add(c[sd][k]);})));
 const slim=cards.map(c=>({id:c.id,deck:c.deck,front:c.front,back:c.back,thumb:c.thumb||null,created:c.created,due:c.due,ivl:c.ivl,ease:c.ease,reps:c.reps,lapses:c.lapses,state:c.state}));
 const parts=['{"app":"mi-musica","type":"flashcards","v":1,"nodes":'+JSON.stringify(nodes)+',"cards":'+JSON.stringify(slim)+',"media":{'];
 let first=true;
 try{
  for(const id of mids){
   const r=await dbGet('fcmedia',id);if(!r)continue;
   const data=await blobToDataURL(r.blob);
   parts.push((first?'':',')+JSON.stringify(id)+':'+JSON.stringify({kind:r.kind,type:r.type,name:r.name,thumb:r.thumb||null,data}));
   first=false;
  }
 }catch(e){toast('No se pudo preparar el archivo');return;}
 parts.push('}}');
 const blob=new Blob(parts,{type:'application/json'});
 const nm=folderId?fcNode(folderId).name.replace(/[^\w-]+/g,'_'):'todo';
 const name='mi-musica-flashcards-'+nm+'-'+new Date().toISOString().slice(0,10)+'.json';
 toast('Archivo listo');
 sheet('Archivo listo ('+sz(blob.size)+')',[{l:'Guardar o compartir el archivo',f:()=>shareBlob(blob,name)}]);
}
async function fcImport(d,parent){
 toast('Importando flashcards…',true);
 const idmap=new Map(),mmap=new Map();let nc=0,nn=0;
 try{
  for(const mid of Object.keys(d.media||{})){
   const m=d.media[mid];if(!m||!m.data)continue;
   const blob=await (await fetch(m.data)).blob();
   const id=uid(),rec={id,kind:m.kind==='img'?'img':'aud',type:m.type||blob.type,name:m.name||'',size:blob.size,created:Date.now(),blob,thumb:m.thumb||null};
   await dbPut('fcmedia',rec);
   fcMeta.set(id,{id,kind:rec.kind,type:rec.type,name:rec.name,size:rec.size,thumb:rec.thumb});
   mmap.set(mid,id);
  }
  (d.nodes||[]).forEach(n=>idmap.set(n.id,uid()));
  for(const n of d.nodes||[]){
   const node={id:idmap.get(n.id),parent:n.parent?(idmap.get(n.parent)||parent||null):(parent||null),name:n.name,created:Date.now()};
   fcNodes.push(node);await dbPut('fcnodes',node);nn++;
  }
  const mp=x=>x?(mmap.get(x)||null):null;
  for(const c of d.cards||[]){
   const deck=idmap.get(c.deck);if(!deck)continue;
   const side=s=>({text:(s&&s.text)||'',say:(s&&s.say)||'',img:mp(s&&s.img),aud:mp(s&&s.aud)});
   const card={id:uid(),deck,front:side(c.front),back:side(c.back),thumb:c.thumb||null,created:c.created||Date.now(),due:c.due||0,ivl:c.ivl||0,ease:c.ease||2.5,reps:c.reps||0,lapses:c.lapses||0,state:c.state||'new'};
   fcCards.push(card);await dbPut('fccards',card);nc++;
  }
  render();toast('Importado: '+nn+' carpetas y '+nc+' tarjetas');
 }catch(e){console.error(e);toast('No se pudo importar ese archivo');}
}
